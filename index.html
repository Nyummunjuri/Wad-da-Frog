<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wad da Frog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, swampy, toy-like
   IDEA: a pond diorama, tilted view; kayak in front, lily pads at the far edge
   PICTURE: the playable swamp itself fills the screen
   COLOUR and TYPE: deep pond green, lily green, orange kayak, frog red accent; Mitr
   LAYOUT: one full-height canvas, centered, letterboxed in pond colour */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c231d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
{
const W=360,H=640;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const FONT='Boogaloo, system-ui, sans-serif';
try{document.fonts.load('40px Boogaloo')}catch(e){}   // canvas text needs the web font fetched up front
const spriteCache=new Map();let newSprites=0;let bgCache=null,shadowGrad=null,vigGrad=null;
let PX=1;   // canvas pixels per game unit
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(2,window.devicePixelRatio||1);PX=s*d;spriteCache.clear();bgCache=null;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);
  ctx.setTransform(s*d,0,0,s*d,0,0);
}
addEventListener('resize',resize);resize();

// ---------- tuning ----------
const TIERS=[{r:10,w:1},{r:14,w:1.3},{r:17,w:1.6},{r:21,w:2},{r:34,w:3}];
const TEEN=3,GIANT=4,GR=34;
const SPECIES={normal:{c:'#74c94f',d:'#3f8a2c',name:'Green'},blue:{c:'#4fa8e6',d:'#24639a',name:'Blue!'},red:{c:'#e8553f',d:'#9c2a1e',name:'Red!'}};
const RED_CHANCE=0.35;
const T_BOARD=5, T_ROWS=8;    // kayak can't sink before T_BOARD / lily rows start
const RAMP=15;             // seconds from T_BOARD to full difficulty
const diff=()=>tut?0:clamp((t-T_BOARD)/RAMP,0,1);
const lerp=(a,b,k)=>a+(b-a)*k;
const BLUE_CHANCE=.3;
const speciesRoll=()=>{const r=Math.random(),red=lerp(.15,.25,diff());return r<red?'red':r<red+BLUE_CHANCE?'blue':'normal'};
const BLAST_R=110;         // two blue giants' explosion radius
// layout: lily strip ~10% | swamp ~58% | kayak ~32%
const TOP=66, SWAMP_BOTTOM=378;
const KY=61.6, KS=1.35, KB=680;   // kayak art is drawn in its own coordinates, shifted down by KY and scaled by KS about y=KB
const K=(x,y)=>[180+(x-180)*KS,KB-(KB-(y+KY))*KS];   // kayak coords -> screen
const BOW_X=180, NEXT_Y=520, LAUNCH_Y=498;   // + KY on screen
const G=-260;              // buoyancy: things float UP (reverse Suika)
const SAFE_WEIGHT=4;
const DRY_WEIGHT=2.5, SINK_WEIGHT=15.5;  // load at which the kayak starts to sit low / goes under (~11 frogs)
const RED_FLOOD=5.3, FLOOD_DRAIN=.75;   // big but short: ~4 frogs' worth of water, gone in ~7 s      // a red frog's hit lets in water worth ~2 frogs (over ~2 s), draining slowly
const FULL_LEVEL=80, SINK_TIME=6;        // load alone sinks the kayak to 80%; past capacity it goes under over ~6 s       // kayak weight before water starts rising
const ATTACK_TIME=1.2;     // red giant's single leap (longer when it jumps from further away)
const RAID_START=11;            // first red raid: a single slow one to learn the slap
const CALM=2.5;
const MERGE_M=5;            // metres per frog-size step for a merge, before the combo multiplier
const COMBO_STEP=.15, COMBO_CAP=2.5;   // each combo step adds +15% to merge distance, up to x2.5
const SUMMARY_AT=1.7;       // the ending plays this long before the summary comes up
const ENTER=.9;            // new rows ease out from under the lily pads over this long, nudging the swamp down
const STRETCH=.28;         // a thrown frog is stretched along its flight for this long
const PULL=.08;            // matching frogs pull together this long before merging
const STAR_EVERY=2000;      // endless: a star for every 2000 m
const FLY_TIME=1.3;         // a new star pops up mid-screen, then flies into place   // distance for each star; all three clears the level
const LEAP_MIN=.65;         // red frogs never get faster than this share of their normal leap time
const BOARD_MIN=.28, BOARD_RAMP=140;   // late game: frogs board up to 1/BOARD_MIN times as often             // breather after a big clear: no boarding, raids or new rows       // red frogs start raiding on their own after this many seconds
const CHARGE=.4;           // giants crouch this long before jumping
const PADS=[36,108,180,252,324], PAD_Y=30;
// waiting frogs line up around the seat, from the lower right, over the front, down the left.
// Bigger frogs take more of the ring; a full ring is about when the kayak goes under.
const RING={rx:66,ry:54,a0:-.27,sweep:Math.PI-.54};   // only the part of the ring that is on screen
const RING_CAP=13.5;   // load (frog weight) that fills the ring
const SIDE_X=275,SIDE_Y=560;    // frogs hop aboard from the water on the right
const HL=[[81,648],[84,576],[146,504],[180,478]],HR=[[279,648],[276,576],[214,504],[180,478]];
const CK={x:180,y:592,rx:42,ry:46};   // cockpit; its rim is where the two waters meet

// ---------- state ----------
let state='start',overAt=0,nextRow=null,reedWarn=0;
let items,raft,parts,texts,attackers,leavers,swimmers,blasts=[];
let maxCombo=0,bestCombo=0,newBestCombo=false,endT0=0,newBest=false,endFx={popped:[]},jumpers=[],escapers=[],mouthT=0,throwSeq=0,throws={},comboPulse=0,rings=[],playTime=0,starsGot=0,flyers=[],winAt=0,calmT=0,flood=0,floodIn=0,raidT=0,raids=0,hitStop=0,ptr=null,scroll,level,dist,t,spawnT,shake,combo,lastMerge,speed,rowT,rowMax,cool,slosh,vl=0,rate=0,pan=0,holdT=0,holdCD=0;
let best=0;try{best=+localStorage.getItem('frogRaftBest')||0}catch(e){}
let bestComboSaved=0;try{bestComboSaved=+localStorage.getItem('frogRaftCombo')||0}catch(e){}

function reset(){
  items=[];raft=[];parts=[];texts=[];attackers=[];leavers=[];swimmers=[];blasts=[];
  level=0;calmT=0;maxCombo=0;throwSeq=0;throws={};comboPulse=0;rings=[];starsGot=0;flyers=[];flood=0;floodIn=0;raidT=0;raids=0;hitStop=0;slosh=0;scroll=0;rate=0;pan=0;dist=0;t=0;spawnT=1.2;shake=0;combo=0;lastMerge=-9;speed=1;rowT=rowMax=6;cool=0;holdT=0;holdCD=0;
  startPile(4);settlePile();nextRow=genRow(false);
  [0,1,0,1,0].forEach((tier,i)=>{const[x,y]=slot(i);raft.push({tier,sp:null,px:x,py:y,d:0})});
}
function ringPoint(f){const a=RING.a0-Math.min(f,1.04)*RING.sweep;return K(CK.x+Math.cos(a)*RING.rx,CK.y+Math.sin(a)*RING.ry)}
function slots(){const out=[K(BOW_X,NEXT_Y)];let s=0;
  for(let i=1;i<raft.length;i++){const w=TIERS[raft[i].tier].w;out.push(ringPoint((s+w/2)/RING_CAP));s+=w}return out}
function slot(i){return slots()[i]||K(BOW_X,NEXT_Y)}
function board(tier,sp,x,y,front){const f={tier,sp,px:x,py:y,d:99};front?raft.unshift(f):raft.push(f)}
// frogs heading for the kayak dive and swim upstream toward it as faint shadows
function dive(tier,sp,x,y,full){swimmers.push({tier,sp,full,sx:x,sy:y,x,y,t:-.35,dur:1.3+Math.random()*.5})}
function rollTier(){const r=Math.random();return r<.31?0:r<.62?1:r<.9?2:3}
function newFrog(){const tier=rollTier();return[tier,tier===TEEN?speciesRoll():null]}
// frogs boarding the kayak skew heavier, so there are fewer throws for the same pressure
function boardFrog(){const r=Math.random(),tier=r<.2?0:r<.48?1:r<.82?2:3;return[tier,tier===TEEN?speciesRoll():null]}
// two frogs that would react the moment they touch (merge, or egg gets eaten)
const clash=(a,as,b,bs)=>(a===b&&(a<TEEN||as===bs))||(a===0&&b===TEEN)||(a===TEEN&&b===0);
function genRow(first){
  const row=[];let x=0;
  while(true){let tier,sp,n=0,prev=row[row.length-1];
    // new rows never put two reacting frogs side by side
    do{tier=rollTier();sp=tier===TEEN?speciesRoll():null}while(prev&&clash(prev.tier,prev.sp,tier,sp)&&++n<12);
    const r=TIERS[tier].r;
    if(x+2*r>W)break;row.push({tier,sp,cx:x+r,r});x+=2*r+1}
  const off=(W-x)/2;for(const q of row)q.cx+=off;return row}
// the swamp starts full, packed so that no two touching frogs would react
function startPile(rows){
  let y=TOP;
  for(let k=0;k<rows;k++){let x=0,h=0;const ox=k%2?8:0;
    while(true){let tier,sp,r,cy,n=0;
      do{tier=k===rows-1||Math.random()<.75?rollTier():Math.floor(Math.random()*4);sp=tier===TEEN?speciesRoll():null;r=TIERS[tier].r;cy=y+r}
      while(++n<25&&items.some(o=>Math.hypot(o.x-(ox+x+r),o.y-cy)<o.r+r+16&&clash(o.tier,o.sp,tier,sp)));
      if(ox+x+2*r>W)break;items.push(mk(tier,sp,ox+x+r,cy,0,0));x+=2*r+1;h=Math.max(h,2*r)}
    y+=h-4}
}
// let the starting pile float into place (no merging), then swap out any touching pair that would react
function settlePile(){
  const touch=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r+4;
  for(let round=0;round<8;round++){
    for(let s=0;s<160;s++){
      for(const b of items){b.vy+=G/60;b.vx*=.9;b.vy*=.9;b.x+=b.vx/60;b.y+=b.vy/60;
        if(b.x<b.r)b.x=b.r;if(b.x>W-b.r)b.x=W-b.r;if(b.y<TOP+b.r){b.y=TOP+b.r;b.vy=0}}
      for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;const m=a.r+b.r;if(d>=m)continue;
        const o=(m-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o}}
    let bad=0;
    for(const a of items){
      if(!items.some(o=>o!==a&&touch(a,o)&&clash(o.tier,o.sp,a.tier,a.sp)))continue;
      bad++;
      for(const tier of[0,1,2,3].sort(()=>Math.random()-.5)){
        const sp=tier===TEEN?speciesRoll():null;
        if(!items.some(o=>o!==a&&touch(a,o)&&clash(o.tier,o.sp,tier,sp))){a.tier=tier;a.sp=sp;a.r=TIERS[tier].r;break}}}
    if(!bad)break;
  }
  // anything still clashing is simply left out
  for(const a of items)if(!a.dead&&items.some(o=>o!==a&&!o.dead&&touch(a,o)&&clash(o.tier,o.sp,a.tier,a.sp)))a.dead=true;
  items=items.filter(b=>!b.dead);
  for(const b of items){b.vx=b.vy=0;b.born=-5;b.calm=true}   // the starting pile never reacts with itself
}
// push the waiting row (previewed under the lily pads) into the swamp
function addRow(first,quiet){
  const row=nextRow,h=row.reduce((m,q)=>Math.max(m,q.r),0)*2,smooth=!first&&!quiet;
  if(!first&&quiet)for(const b of items)b.y+=h;
  const fresh=[];
  for(const q of row){const y=TOP+q.r;let n=0;
    // don't drop a frog right onto one it would react with (the swamp should fill up, not melt)
    while(n++<12&&(items.some(o=>Math.hypot(o.x-q.cx,o.y-y)<o.r+q.r+12&&clash(o.tier,o.sp,q.tier,q.sp))||
      fresh.some(o=>Math.abs(o.x-q.cx)<o.r+q.r+3&&clash(o.tier,o.sp,q.tier,q.sp)))){
      q.tier=rollTier();q.sp=q.tier===TEEN?speciesRoll():null;q.r=Math.min(TIERS[q.tier].r,q.r)}
    const b=mk(q.tier,q.sp,q.cx,smooth?TOP-q.r*.7:y,0,0);if(smooth){b.enter=ENTER;b.ty=y;b.pop=0}fresh.push(b)}
  items.push(...fresh);
  nextRow=genRow(false);
}
function mk(tier,sp,x,y,vx,vy){return{tier,sp,x,y,vx,vy,r:TIERS[tier].r,low:0,born:t,pop:.25,dead:false,wob:Math.random()*6,surf:0}}
function start(fromIntro){reset();sinking=false;jumpers=[];escapers=[];state='play';tut=0;tutMsgT=0;
  // coming from the title, the starting pile drifts in instead of popping up
  if(fromIntro)for(const b of items){b.ty=b.y;b.y-=60;b.enter=ENTER;b.pop=0}}
// ---------- title: an empty swamp, one green frog on the bow; tap and it leaps in, then the game starts ----------
let intro=null;
function startScene(){reset();items=[];raft=[];const[x,y]=slot(0);raft.push({tier:TEEN,sp:'normal',px:x,py:y,d:0});state='start'}
function beginIntro(tutorial){const f=raft.shift();intro={x0:f.px,y0:f.py,x:f.px,y:f.py,t:0,tut:tutorial,splash:false};state='intro'}
const INTRO_JUMP=.55,INTRO_END=1.25;
function introUpdate(dt){const it=intro;it.t+=dt;const p=Math.min(1,it.t/INTRO_JUMP),tx=180,ty=430;
  it.x=it.x0+(tx-it.x0)*p;it.y=it.y0+(ty-it.y0)*p-Math.sin(p*Math.PI)*80;
  if(p>=1&&!it.splash){it.splash=true;tone(160,.25,'sine',.22,.45);tone(900,.08,'triangle',.08,.6);
    for(let i=0;i<16;i++){const a=-Math.PI*(.1+.8*Math.random()),v=80+Math.random()*140;parts.push({x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1.5+Math.random()*2.5,c:'rgba(205,240,255,.85)',life:.6})}}
  if(it.t>=INTRO_END){intro=null;if(it.tut)startTutorial();else start(true)}}
function drawIntro(){const it=intro;if(!it)return;const r=TIERS[TEEN].r;
  if(!it.splash){drawCreature(it.x,it.y,TEEN,'normal',r,t,0,null,1+.15*Math.sin(Math.min(1,it.t/INTRO_JUMP)*Math.PI));return}
  const k=clamp((it.t-INTRO_JUMP)/(INTRO_END-INTRO_JUMP),0,1);
  for(let i=0;i<2;i++){const q=clamp(k*1.3-i*.3,0,1);ctx.strokeStyle='rgba(205,240,255,'+(.7*(1-q))+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(it.x,it.y,r*(.6+q*2),r*(.25+q*.7),0,0,Math.PI*2);ctx.stroke()}
  ctx.globalAlpha=Math.max(0,1-k*2.2);drawCreature(it.x,it.y-6*k,TEEN,'normal',r,t,0,null,1-.4*k);ctx.globalAlpha=1}
function drawTitle(){
  const a=state==='intro'?Math.max(0,1-intro.t/.3):1;if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
  ctx.font='400 56px '+FONT;ctx.lineWidth=8;ctx.lineJoin='round';ctx.strokeStyle='rgba(6,30,22,.55)';ctx.strokeText('Wad da Frog',W/2,195);ctx.fillStyle='#fff';ctx.fillText('Wad da Frog',W/2,195);
  ctx.font='400 22px '+FONT;ctx.fillStyle='#fff';ctx.globalAlpha=a*(.6+Math.sin(performance.now()/300)*.4);ctx.fillText('Tap to start',W/2,300);
  if(tutDone){ctx.globalAlpha=a*.75;ctx.font='400 14px '+FONT;ctx.fillStyle='#fff';ctx.lineWidth=4;ctx.strokeText('↻ How to play',W/2,H-24);ctx.fillText('↻ How to play',W/2,H-24)}
  ctx.restore()}
// ---------- tutorial: on the very first play, four guided steps in the same swamp, then the real game ----------
// 1 throw · 2 merge · 3 the kayak sinks with load · 4 slap the red frog
let tutEater=null,tutEatPhase='',tutPhase='',tutSunkT=0,tutDip=0,sinkA=0,sinkTick=0,tutPeak=0,tut=0,tutT=0,tutNext=0,tutNeed=0,tutSpawn=0,tutSpawnT=0,tutRed=null,tutMsgT=0,tutFade=0,curLoad=0;
let tutDone=false;   // every time the game is opened the tutorial plays again (Skip button to jump past it)
const TUT_TEXT=['','Swipe up to throw a frog','Hit a matching one to merge','Too heavy = sinking! Throw frogs off','','Tap the red frog before it lands!'];
function startTutorial(){
  start();tut=0;items=[];raft=[];attackers=[];   // the tutorial starts in an empty swamp
  tutStep(1);
}
function tutStep(n){tut=n;tutT=0;tutNext=0;tutFade=0;
  if(n>1){tone(1319,.12,'triangle',.12);setTimeout(()=>tone(1760,.18,'triangle',.12),90);burst(W/2,300,'#ffe27a',14)}
  if(n===1){raft=[];board(0,null,...K(BOW_X,NEXT_Y))}
  if(n===2){tutNeed=0;raft=[]}
  if(n===3){tutPhase='fill';tutSpawnT=.3;tutPeak=0}   // fill: watch it sink once · sunk: frogs bail, kayak refloats · try: your turn
  if(n===4){while(raft.length>1){const f=raft.pop();burst(f.px,f.py,'rgba(200,240,255,.8)',8)}
    if(raft[0])raft[0].tier=0;tutEater=null;tutEatPhase='feed'}
  if(n===5){tutRed=null}
}
function endTutorial(){
  tut=0;tutDone=true;
  // the real game starts its clock now, in the same swamp
  t=T_BOARD;for(const b of items)b.born=-5;   // the warm-up is done: start where the kayak can already sink
  spawnT=1.2;rowT=rowMax=6;raidT=0;raids=0;dist=0;starsGot=0;flyers=[];combo=0;maxCombo=0;calmT=0;
  attackers=attackers.filter(a=>a.swatted);
  // lighten the kayak for the real start: extra frogs hop off into the water
  while(raft.length>3){const f=raft.pop();burst(f.px,f.py,'rgba(200,240,255,.8)',8)}
  tutMsgT=2.4;tone(1047,.12,'triangle',.12);setTimeout(()=>tone(1568,.25,'triangle',.13),110);
}
// the frog of the size the merge step needs, closest to the middle of the swamp
function tutTarget(){let best=null,bd=1e9;
  for(const b of items){if(b.dead||b.thrown||b.calm||b.tier!==tutNeed||b.enter>0)continue;const d=Math.abs(b.x-180)+Math.abs(b.y-180)*.5;if(d<bd){bd=d;best=b}}
  return best}
function tutUpdate(dt){
  tutT+=dt;tutFade=Math.min(1,tutFade+dt*3);
  if(tutMsgT>0){tutMsgT-=dt}
  if(!tut)return;
  if(tutNext>0){tutNext-=dt;if(tutNext<=0){if(tut<5)tutStep(tut+1);else endTutorial()}return}
  if(tut===1&&!raft.length&&!items.some(b=>b.thrown))board(0,null,...K(SIDE_X,SIDE_Y));
  if(tut===2){
    if(!tutTarget()){const b=mk(tutNeed,null,180,TOP+80,0,0);b.pop=.25;items.push(b);burst(180,TOP+80,'#cfe9ff',8)}
    if(!raft.length)board(tutNeed,null,...K(SIDE_X,SIDE_Y));
    else if(raft[0].tier!==tutNeed)raft[0].tier=tutNeed}
  if(tut===3){
    if(tutPhase==='sunk'){tutSunkT+=dt;
      tutDip=tutSunkT<.5?tutSunkT/.5:tutSunkT<1.7?1:Math.max(0,1-(tutSunkT-1.7)/.6);
      for(const j of jumpers){j.vy+=700*dt;j.x+=j.vx*dt;j.y+=j.vy*dt;j.rot+=j.spin*dt}
      if(tutSunkT>=2.4){tutPhase='try';tutDip=0;jumpers=[];tutPeak=0;tutT=0;tutFade=0;tutSpawnT=.3;board(0,null,...K(SIDE_X,SIDE_Y))}
      return}
    // frogs keep boarding until the kayak is overloaded and starts going under
    if(curLoad<1.05&&!(tutPhase==='try'&&tutPeak>=1)){tutSpawnT-=dt;if(tutSpawnT<=0){tutSpawnT=tutPhase==='fill'?.2:.14;
      board(Math.random()<.5?1:2,null,...K(SIDE_X,SIDE_Y));burst(...K(SIDE_X,SIDE_Y),'rgba(200,240,255,.8)',7)}}
    if(tutPhase==='try'){tutPeak=Math.max(tutPeak,curLoad);
      // done once the player has thrown it back to safety
      if(tutPeak>=1&&curLoad<.65)tutNext=.6}
    if(!raft.length)board(0,null,...K(SIDE_X,SIDE_Y))}
  if(tut===4){
    // a grown frog eats eggs; after 3 it's full, dives and swims to the front of the line
    if(tutEatPhase==='feed'){
      if(!tutEater||(tutEater.dead&&!(tutEater.fat>=3))){const b=mk(TEEN,'normal',180,190,0,0);b.pop=.25;items.push(b);tutEater=b;burst(180,190,'#9be37a',10)}
      if(tutEater.dead&&tutEater.fat>=3){tutEatPhase='swim';tutT=0;tutFade=0}
      if(!raft.length)board(0,null,...K(SIDE_X,SIDE_Y));else if(raft[0].tier!==0&&raft[0].d<4&&!raft[0].tut)raft[0].tier=0}
    else if(!swimmers.length&&tutT>.5){tutEatPhase='done';tutNext=1.6}
    return}
  if(tut===5){
    if(!tutRed&&tutT>.7){attack(180,TOP+GR*.6,CHARGE+.25);tutRed=attackers[attackers.length-1]}
    if(tutRed&&tutRed.swatted)tutNext=1.1;
    if(!raft.length)board(0,null,...K(SIDE_X,SIDE_Y))}
}
function tutSank(){if(tutPhase==='sunk')return;tutPhase='sunk';tutSunkT=0;sadSound();drag=null;
  jumpers=raft.map(it=>({x:it.px,y:it.py,tier:it.tier,sp:it.sp,vx:(it.px-180)*2.2+(Math.random()-.5)*80,vy:-220-Math.random()*160,rot:0,spin:(Math.random()-.5)*10}));

  if(t0<T_ROWS&&t>=T_ROWS)say(W/2,300,'ใบบัวหุบ = กบแถวใหม่ดันลงมา','#c8ff9e',17,2.6);
  speed=1+6*diff();

  if(calmT<=0&&!tut)spawnT-=dt;
  if(spawnT<=0){spawnT=1.4*lerp(2.0,1.2,diff())*Math.max(BOARD_MIN,1-Math.max(0,t-40)/BOARD_RAMP)*Math.max(.5,1-Math.max(0,t-210)/180);   // and a slow squeeze for very long runs

  if(!raft.length&&!tut){board(...newFrog(),...K(SIDE_X,SIDE_Y));burst(...K(SIDE_X,SIDE_Y),'rgba(200,240,255,.8)',5)}

    const left=Math.random()<.5,[x,y]=K(...bez(left?HL:HR,.15+Math.random()*.7));
    for(let i=0;i<5;i++)parts.push({x,y,vx:(left?1:-1)*(30+Math.random()*70),vy:-40-Math.random()*70,r:1.5+Math.random()*2,c:'rgba(200,240,255,.85)',life:.5})}}
  // grown frogs open their mouths when an egg is near

  for(const b of items)if(b.tier===TEEN){
    if(recheck){b.near=eggNext;if(!b.near)for(const e of items)if(e.tier===0&&Math.hypot(e.x-b.x,e.y-b.y)<b.r+e.r+70){b.near=true;break}}

      if(b.sp==='blue'){if(b.lead)giant((b.x+b.pair.x)/2,(b.y+b.pair.y)/2,'blue')}

        let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const m=a.r+b.r;

// ---------- drawing ----------
// Frogs are drawn from pre-rendered sprites (much cheaper than redrawing every shape each frame).
// Tadpoles get 6 tail-wiggle frames; sc scales the sprite for frogs that grow or shrink on screen.
// Only grown frogs with an open mouth or cheeks are drawn live.
const TAD_FRAMES=6;
function drawCreature(x,y,tier,sp,r,tm,rot,o,sc){
  sc=sc||1;
  if(o&&(o.fat||o.mo>.08||o.gulp)){if(sc!==1){ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);drawCreatureRaw(0,0,tier,sp,r,tm,rot,o);ctx.restore()}else drawCreatureRaw(x,y,tier,sp,r,tm,rot,o);return}

  const key=tier+'|'+sp+'|'+Math.round(r*2)+'|'+fr;let img=spriteCache.get(key);

    if(newSprites>=4){ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);drawCreatureRaw(0,0,tier,sp,r,tm,rot,o);ctx.restore();return}
    newSprites++;if(spriteCache.size>500)spriteCache.clear();
    // extents of each kind of creature (left/right, top, bottom) in units of r
    const ex=tier===0?[1.1,1.1,1.1]:tad?[1.15,1.1,2.05]:tier===GIANT?[1.2,2.05,1.05]:[1.2,1.05,1.05];
    const w=ex[0]*2*r,h=(ex[1]+ex[2])*r;img=document.createElement('canvas');img.width=Math.ceil(w*PX);img.height=Math.ceil(h*PX);
    const c=img.getContext('2d'),keep=ctx;c.scale(PX,PX);c.translate(ex[0]*r,ex[1]*r);ctx=c;
    drawCreatureRaw(0,0,tier,sp,r,tad?(fr+.5)/TAD_FRAMES*2*Math.PI/11:0,0,null);ctx=keep;img.ox=ex[0]*r;img.oy=ex[1]*r;img.w=w;img.h=h;spriteCache.set(key,img)}

  else ctx.drawImage(img,x-img.ox*sc,y-img.oy*sc,img.w*sc,img.h*sc);

function drawCreatureRaw(x,y,tier,sp,r,tm,rot,o){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  if(tier===0){
    ctx.fillStyle='rgba(205,232,255,.55)';dot(0,0,r);
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#1d2420';dot(r*.12,-r*.08,r*.34);
    ctx.fillStyle='rgba(255,255,255,.85)';dot(-r*.42,-r*.42,r*.16);
  }else if(tier<TEEN){
    const w=Math.sin(tm*11)*r*.5,legs=tier===2,body=legs?'#7d9160':'#3e424c';
    if(legs){ctx.fillStyle='#5f7348';ell(-r*.7,r*.55,r*.32,r*.16);ell(r*.7,r*.55,r*.32,r*.16)}
    ctx.fillStyle=body;
    ctx.beginPath();ctx.moveTo(-r*.45,r*.5);ctx.quadraticCurveTo(w,r*1.3,w*1.3,r*1.9);
    ctx.quadraticCurveTo(w*.4,r*1.2,r*.45,r*.5);ctx.closePath();ctx.fill();
    dot(0,0,r);

    ctx.fillStyle='#111';dot(-r*.36,-r*.22,r*.1);dot(r*.36,-r*.22,r*.1);

    ctx.fillStyle=s.d;ell(-r*.78,r*.5,r*.36,r*.22);ell(r*.78,r*.5,r*.36,r*.22);
    ctx.fillStyle=s.c;ell(0,0,r,r*.88);
    const fat=o&&o.fat||0,mo=o&&o.mo||0,gp=o&&o.gulp?.6:0;
    if(fat||gp){const cr=r*(.16+.12*(fat+gp));ctx.fillStyle=s.c;dot(-r*.8,r*.16,cr);dot(r*.8,r*.16,cr);
      ctx.fillStyle='rgba(255,150,150,.4)';dot(-r*.8,r*.16,cr*.55);dot(r*.8,r*.16,cr*.55)}
    ctx.fillStyle='rgba(255,255,220,.35)';ell(0,r*.3,r*.6,r*.42);
    if(tier===GIANT){ctx.fillStyle=s.d;dot(-r*.5,-r*.1,r*.12);dot(r*.45,r*.05,r*.1);dot(r*.1,-r*.35,r*.08)}
    ctx.fillStyle=s.c;dot(-r*.42,-r*.68,r*.32);dot(r*.42,-r*.68,r*.32);
    ctx.fillStyle='#fff';dot(-r*.42,-r*.7,r*.23);dot(r*.42,-r*.7,r*.23);
    ctx.fillStyle='#111';dot(-r*.4,-r*.68,r*.11);dot(r*.4,-r*.68,r*.11);
    ctx.strokeStyle=s.d;ctx.lineWidth=Math.max(2,r*.08);ctx.lineCap='round';
    if(mo>.08){ctx.fillStyle='#3a1410';ell(0,r*.22,r*.42,r*.34*mo);
      ctx.fillStyle='#ff8fa0';ell(0,r*.22+r*.16*mo,r*.2,r*.1*mo)}
    else{ctx.beginPath();ctx.arc(0,r*.02,r*.45,.2*Math.PI,.8*Math.PI);ctx.stroke()}
    if(tier===GIANT){
      if(sp==='red'){
        ctx.fillStyle='#e9dfc6';
        ctx.beginPath();ctx.moveTo(-r*.55,-r*1.05);ctx.quadraticCurveTo(-r*1.05,-r*1.2,-r*.95,-r*1.7);ctx.quadraticCurveTo(-r*.75,-r*1.3,-r*.3,-r*1.2);ctx.fill();
        ctx.beginPath();ctx.moveTo(r*.55,-r*1.05);ctx.quadraticCurveTo(r*1.05,-r*1.2,r*.95,-r*1.7);ctx.quadraticCurveTo(r*.75,-r*1.3,r*.3,-r*1.2);ctx.fill();
        ctx.fillStyle='#7d838e';ctx.beginPath();ctx.ellipse(0,-r*.98,r*.62,r*.5,0,Math.PI,0);ctx.fill();

        const fl=.7+Math.sin(tm*30)*.3;ctx.fillStyle='rgba(255,200,80,'+fl+')';dot(r*.15,-r*1.97,r*.14*fl+r*.05);ctx.fillStyle='#fff6c8';dot(r*.15,-r*1.97,r*.06);

function drawBG(){
  if(!bgCache){bgCache=document.createElement('canvas');bgCache.width=Math.ceil(W*PX);bgCache.height=Math.ceil(H*PX);
    const c=bgCache.getContext('2d');c.scale(PX,PX);
    const g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#123b31');g.addColorStop(.12,'#1a4a3d');g.addColorStop(.66,'#1d5444');g.addColorStop(1,'#2a6a5e');
    c.fillStyle=g;c.fillRect(0,0,W,H)}
  ctx.drawImage(bgCache,0,0,W,H);
  // ripples (far = flatter)
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=2;
  for(let i=0;i<7;i++){const y=TOP+((i*83+scroll)%(H-TOP));const k=y/H;
    ctx.beginPath();ctx.ellipse(50+(i*61)%260,y,24+30*k,4+6*k,0,0,Math.PI*2);ctx.stroke()}
  // leaves drifting past along both banks
  for(let i=0;i<8;i++){const y=((i*97+scroll*1.1)%(H+60))-30,k=.6+.6*y/H,x=i%2?W-14-(i*7)%22:14+(i*11)%22;
    ctx.save();ctx.translate(x,y);ctx.rotate(i*1.3+Math.sin(t+i)*.2);ctx.scale(k,k);
    ctx.fillStyle=i%3?'#3d7f4a':'#5b8f3e';ell(0,0,9,5);ctx.strokeStyle='rgba(20,60,30,.6)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.stroke();ctx.restore()}
  // far shore band behind the lily pads
  ctx.fillStyle='#0d2c24';ctx.fillRect(0,0,W,12);
  ctx.fillStyle='#24543a';
  for(let x=0;x<W;x+=14){const h=6+((x*7)%9);ctx.fillRect(x,12-h,4,h)}
  // overflow line
  // reed line: the pile spills onto the kayak past here
  const rw=reedWarn,rc=Math.round(63+(214-63)*rw)+','+Math.round(122+(84-122)*rw)+','+Math.round(69+(60-69)*rw);

  for(const j of jumpers){j.vy+=700*dt;j.x+=j.vx*dt;j.y+=j.vy*dt;j.rot+=j.spin*dt}
  for(const e of escapers)e.t+=dt;
  for(const l of leavers)l.t+=dt/.9;leavers=leavers.filter(l=>l.t<1);
  const e=t-endT0;
  if(state==='over'&&e<1.6&&Math.random()<.6){const[bx,by]=K(180+(Math.random()-.5)*120,560+Math.random()*60);
    parts.push({x:bx,y:by,vx:(Math.random()-.5)*10,vy:-90-Math.random()*60,r:1.5+Math.random()*3,c:'rgba(215,245,255,.7)',life:.9})}
  // the star count on the summary ticks up, one note per star
  const sn=endStarCount(e);
  while((endFx.n||0)<sn){endFx.n=(endFx.n||0)+1;endFx.pop=.25;tone(NOTES[Math.min(NOTES.length-1,endFx.n-1)]*2,.18,'triangle',.13)}
  endFx.pop=Math.max(0,(endFx.pop||0)-dt);

  if(newBest&&!endFx.party&&e>=SUMMARY_AT+1.3){endFx.party=true;fanfareSound();endFx.conf=[];
    for(let i=0;i<60;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=220+Math.random()*320;
      endFx.conf.push({x:W/2,y:380,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*3,rot:Math.random()*6,c:['#ffd34a','#ff6b9a','#9be37a','#9fd8ff','#ffa043'][i%5],life:1.6+Math.random()*.8})}}
  if(endFx.conf)for(const c of endFx.conf){c.vy+=420*dt;c.vx*=.985;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=dt*8;c.life-=dt}
}

        ctx.beginPath();ctx.ellipse(a.x,a.y+GR*.4,GR*(1+ph*1.3),GR*(.35+ph*.5),0,0,Math.PI*2);ctx.stroke()}
      ctx.save();ctx.globalAlpha=Math.min(1,k*3);ctx.translate(a.x,a.y+GR*.15*k);ctx.scale(1+.16*k,1-.2*k);drawCreature(0,0,GIANT,'red',GR,t);ctx.restore();continue}
    if(!a.swatted){ctx.strokeStyle='rgba(255,90,70,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(a.x,a.y,GR*s+8+Math.sin(t*14)*3,0,Math.PI*2);ctx.stroke()}
    drawCreature(a.x,a.y,GIANT,'red',GR,t,a.rot,null,s);
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;dot(p.x,p.y,p.r)}
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const s of texts){ctx.globalAlpha=Math.min(1,s.life*1.5);ctx.font='400 '+s.size+'px '+FONT;
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.strokeText(s.s,s.x,s.y);ctx.fillStyle=s.c;ctx.fillText(s.s,s.x,s.y)}
  ctx.globalAlpha=1;
  if(vl>.05){if(!vigGrad){vigGrad=ctx.createRadialGradient(W/2,H*.45,H*.3,W/2,H*.45,H*.78);vigGrad.addColorStop(0,'rgba(8,45,60,0)');vigGrad.addColorStop(1,'rgba(8,45,60,1)')}
    ctx.globalAlpha=Math.min(.85,vl*.9);ctx.fillStyle=vigGrad;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  if(state==='play')drawSinkBar(1/60);
  if(!tut&&state!=='start'&&state!=='intro')drawHUD();
  drawIntro();
  drawTut();
  ctx.restore();
  if(state==='start'||state==='intro')drawTitle();
  if(state==='over'||state==='win')drawEnd();
}
function drawEnd(){
  const e=t-endT0,win=state==='win';
  // the screen dims as the ending plays, then the summary builds up piece by piece
  const dim=clamp((e-.3)/(SUMMARY_AT-.3),0,1)*.86;ctx.fillStyle='rgba(6,20,16,'+dim+')';ctx.fillRect(0,0,W,H);
  const k=clamp((e-SUMMARY_AT)/.35,0,1);if(k<=0)return;
  ctx.textAlign='center';ctx.globalAlpha=k;
  ctx.font='400 32px '+FONT;ctx.fillStyle=win?'#c8ff9e':'#9fd8e8';ctx.fillText(win?'Level clear!':newBest?'Farthest ever!':'Sunk!',W/2,110-14*(1-k));ctx.globalAlpha=1;
  endStars(170,e);
  const cnt=clamp((e-SUMMARY_AT-.4)/.8,0,1),shown=Math.floor(dist*cnt*(2-cnt));
  const pt=Math.floor(playTime),mm=Math.floor(pt/60),ss=String(pt%60).padStart(2,'0');
  ctx.globalAlpha=clamp((e-SUMMARY_AT-.3)/.3,0,1);
  ctx.font='400 22px '+FONT;ctx.fillStyle='#fff';ctx.fillText(shown+' m',W/2,262);
  ctx.font='400 17px '+FONT;ctx.fillStyle='#cfe9ff';ctx.fillText('Time '+mm+':'+ss,W/2,292);
  ctx.fillStyle=newBestCombo?'#ffa043':'#cfe9ff';ctx.fillText('Max combo x'+maxCombo+(newBestCombo?'  New!':'  (best x'+bestComboSaved+')'),W/2,320);
  if(!win){ctx.font='400 15px '+FONT;ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('Best '+best+' m',W/2,350)}
  if(newBest&&cnt>=1){const pu=1+Math.sin(e*7)*.08;ctx.save();ctx.translate(W/2,win?352:380);ctx.scale(pu,pu);
    ctx.fillStyle='#ff6b9a';ctx.beginPath();ctx.roundRect?ctx.roundRect(-52,-15,104,26,13):ctx.rect(-52,-15,104,26);ctx.fill();
    ctx.font='400 14px '+FONT;ctx.fillStyle='#fff';ctx.fillText('New best!',0,4);ctx.restore()}
  ctx.globalAlpha=1;
  if(endFx.conf)for(const c of endFx.conf){if(c.life<=0)continue;ctx.globalAlpha=Math.min(1,c.life);ctx.fillStyle=c.c;
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillRect(-c.r,-c.r*.5,c.r*2,c.r);ctx.restore()}
  ctx.globalAlpha=1;
  if(e>SUMMARY_AT+.9){ctx.font='400 17px '+FONT;ctx.fillStyle='#ffe27a';
    ctx.globalAlpha=.6+Math.sin(performance.now()/300)*.4;ctx.fillText('Tap to play again',W/2,H-60);ctx.globalAlpha=1}
}
// the end screen star count: a big star, the count ticking up, and how far the next one was
function endStars(y,e){
  const p=clamp((e-SUMMARY_AT-.1)/.3,0,1);if(p<=0)return;
  const n=endStarCount(e),sc=1+(endFx.pop||0)*1.2;
  ctx.save();ctx.globalAlpha=p;ctx.translate(W/2-34,y);ctx.scale(sc,sc);drawStar(0,0,26,n>0);ctx.restore();
  ctx.globalAlpha=p;ctx.textAlign='left';ctx.font='400 34px '+FONT;ctx.fillStyle=n>0?'#ffd34a':'rgba(255,255,255,.5)';ctx.fillText('×'+n,W/2-2,y+12);
  ctx.textAlign='center';ctx.font='400 13px '+FONT;ctx.fillStyle='rgba(255,255,255,.65)';
  ctx.fillText('A star every '+STAR_EVERY.toLocaleString()+' m · next one in '+Math.ceil((starsGot+1)*STAR_EVERY-dist)+' m',W/2,y+48);ctx.globalAlpha=1;
}

startScene();
let last=performance.now();
function loop(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(state==='play')update(dt);else{t+=dt;endUpdate(dt);if(state==='intro')introUpdate(dt)}
  for(const f of flyers)f.t+=dt;
  const L=Math.min(level,100),vt=L<25?L/25*.35:.35+(L-25)/75*.65;
  vl+=(vt-vl)*Math.min(1,dt*(state==='play'&&level<100?3:1.6));
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
